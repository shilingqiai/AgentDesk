<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企业智能服务台 — AI Agent 演示</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* SPA Layout — only layout-specific styles */
        .spa-shell { display:flex; flex-direction:column; height:100vh; }

        /* Identity Bar */
        .id-bar {
            display:flex; align-items:center; gap:6px;
            padding:10px 16px;
            background: var(--bg-card); border-bottom:1px solid var(--border);
            box-shadow: var(--shadow); z-index:20; flex-shrink:0;
        }
        .id-bar .id-label { font-size:11px; color:var(--text-secondary); margin-right:8px; text-transform:uppercase; letter-spacing:0.5px; }
        .id-btn {
            padding:7px 16px; border-radius:20px; border:2px solid transparent;
            background: var(--bg-input); cursor:pointer; font-size:13px; font-weight:500;
            font-family:inherit; transition:all 0.2s; white-space:nowrap;
        }
        .id-btn:hover { border-color: var(--accent-light); background: #fff; }
        .id-btn.active {
            background: var(--accent); color:#fff; border-color:var(--accent);
            font-weight:600; box-shadow:0 2px 8px rgba(108,92,231,0.3);
        }
        .id-btn.manager.active { background:#e17055; border-color:#e17055; box-shadow:0 2px 8px rgba(225,112,85,0.3); }
        .id-btn.hr.active { background:#0984e3; border-color:#0984e3; box-shadow:0 2px 8px rgba(9,132,227,0.3); }
        .id-btn.admin-btn.active { background:#2d3436; border-color:#2d3436; box-shadow:0 2px 8px rgba(45,52,54,0.3); }

        /* Tab Sidebar */
        .tab-nav {
            display:flex; flex-direction:column; gap:2px;
            width:140px; min-width:140px;
            background:var(--bg-sidebar); padding:12px 8px;
        }
        .tab-btn {
            display:flex; align-items:center; gap:8px;
            padding:10px 14px; border-radius:8px; border:none;
            background:transparent; color:var(--text-sidebar-muted);
            cursor:pointer; font-size:13px; font-family:inherit;
            transition:all 0.15s; text-align:left; width:100%;
        }
        .tab-btn:hover { background:rgba(255,255,255,0.06); color:#fff; }
        .tab-btn.active { background:rgba(108,92,231,0.2); color:#fff; font-weight:600; }

        /* Content */
        .tab-content { flex:1; overflow-y:auto; min-width:0; }

        /* Approval badge */
        .approval-dot {
            display:inline-block; width:8px; height:8px; border-radius:50%;
            background:var(--danger); margin-left:auto; animation:pulse 1.5s infinite;
        }
    </style>
</head>
<body>

<div class="spa-shell" x-data="spaApp()">

    <!-- ═══ Identity Bar ═══ -->
    <header class="id-bar">
        <span class="id-label"><i class="fas fa-users"></i> 身份切换</span>
        <template x-for="id in IDENTITIES" :key="id.key">
            <button class="id-btn"
                    :class="{ active: identity === id.key,
                              manager: id.role === 'manager',
                              hr: id.role === 'hr',
                              'admin-btn': id.role === 'admin' }"
                    @click="switchIdentity(id.key)"
                    x-text="id.label"></button>
        </template>
    </header>

    <!-- ═══ Body: Tab Nav + Content ═══ -->
    <div style="display:flex; flex:1; overflow:hidden;">
        <!-- Left Tab Nav -->
        <nav class="tab-nav">
            <template x-for="tab in visibleTabs" :key="tab.key">
                <button class="tab-btn"
                        :class="{ active: activeTab === tab.key }"
                        @click="switchTab(tab.key)">
                    <span x-text="tab.label"></span>
                    <span class="approval-dot" x-show="tab.key === 'approval' && pendingApprovalCount > 0"
                          :title="pendingApprovalCount + ' 待审批'"></span>
                </button>
            </template>
        </nav>

        <!-- Right Content Area -->
        <main class="tab-content" id="tab-content">
            <!-- Chat Tab -->
            <div x-show="activeTab === 'chat'" x-transition.opacity.duration.150ms
                 style="display:flex;flex-direction:column;height:100%;">
                {% include 'partials/_tab_chat.html' %}
            </div>

            <!-- Tickets Tab -->
            <div x-show="activeTab === 'tickets'" x-transition.opacity.duration.150ms
                 style="padding:20px;">
                {% include 'partials/_tab_tickets.html' %}
            </div>

            <!-- Approval Tab -->
            <div x-show="activeTab === 'approval'" x-transition.opacity.duration.150ms
                 style="max-width:1100px;margin:0 auto;padding:24px 20px;width:100%;">
                {% include 'partials/_tab_approval.html' %}
            </div>

            <!-- Admin Tab -->
            <div x-show="activeTab === 'admin'" x-transition.opacity.duration.150ms
                 style="max-width:1100px;margin:0 auto;padding:24px 20px;width:100%;">
                {% include 'partials/_tab_admin.html' %}
            </div>
        </main>
    </div>
</div>

<!-- ═══ JS Modules ═══ -->
<script src="/static/js/app.js?v=20260619d"></script>
<script src="/static/js/chat.js?v=20260619d"></script>
<script src="/static/js/ticket.js?v=20260619d"></script>
<script src="/static/js/approval.js?v=20260619d"></script>
<script src="/static/js/admin.js?v=20260619d"></script>

<!-- ═══ SPA Bootstrap ═══ -->
<script>
// Bridge app.js identity into global scope for chat.js compat
window.currentIdentity = loadIdentity();
window.getRole = getRole;
window.THREAD_KEY = THREAD_KEY;
window.MSG_STORE_KEY = MSG_STORE_KEY;
window.threadId = getThreadId();

document.addEventListener('alpine:init', () => {
    Alpine.data('spaApp', () => ({
        identity: window.currentIdentity,
        activeTab: loadTab(window.currentIdentity),
        IDENTITIES: IDENTITIES,
        TABS: TABS,
        pendingApprovalCount: 0,
        approvalPollTimer: null,
        _lastApprovalCount: -1,

        get visibleTabs() {
            return getVisibleTabs(this.identity);
        },

        get role() {
            return getRole(this.identity);
        },

        // ============================================================
        // 身份切换（企业级全量刷新）
        // ============================================================
        switchIdentity(key) {
            const oldIdentity = this.identity;
            this.identity = key;
            window.currentIdentity = key;
            saveIdentity(key);

            // 1. 清除聊天缓存（旧身份的对话不应残留）
            if (typeof clearStoredMessages === 'function') clearStoredMessages();

            // 2. 重置 threadId（新身份 = 新会话）
            if (typeof resetThreadId === 'function') {
                window.threadId = resetThreadId();
            }

            // 3. 重设可见 Tab
            const visible = getVisibleTabs(key);
            if (!visible.find(t => t.key === this.activeTab)) {
                this.activeTab = visible[0] ? visible[0].key : 'chat';
            }
            saveTab(this.activeTab);

            // 4. Toast 提示
            if (oldIdentity !== key) {
                showToast('已切换为: ' + key, 'info', 2000);
            }

            // 5. 重启审批轮询
            this.stopApprovalPolling();
            this.pendingApprovalCount = 0;
            this._lastApprovalCount = -1;
            if (visible.find(t => t.key === 'approval')) {
                this.startApprovalPolling();
            }

            // 6. 刷新当前 Tab
            this.onTabChange();

            // 7. 后台预加载审批计数（即使不在审批 Tab）
            if (typeof initApprovals === 'function') {
                initApprovals().catch(() => {});
            }
        },

        switchTab(key) {
            this.activeTab = key;
            saveTab(key);
            this.onTabChange();
        },

        // ============================================================
        // Tab 切换
        // ============================================================
        async onTabChange() {
            // Small delay for x-show to render DOM
            await new Promise(r => setTimeout(r, 50));

            if (this.activeTab === 'chat') {
                if (typeof loadAgentRoster === 'function') loadAgentRoster();
                if (typeof restoreChatHistory === 'function') restoreChatHistory();
                const input = document.getElementById('user-input');
                if (input) input.focus();
            } else if (this.activeTab === 'tickets') {
                // Refresh tickets — use window.Alpine.$data for Alpine 3.x compat
                const el = document.querySelector('[x-data="ticketsApp()"]');
                let data = null;
                if (el) {
                    try { data = window.Alpine.$data(el); } catch (e) {}
                    if (!data && el._x_dataStack) data = el._x_dataStack[0];
                    if (!data && el.__x) data = el.__x.$data;
                }
                if (data && typeof data.loadTickets === 'function') {
                    data.loadTickets();
                    data.loadStats();
                }
            } else if (this.activeTab === 'approval') {
                if (typeof initApprovals === 'function') await initApprovals();
            } else if (this.activeTab === 'admin') {
                if (typeof initAdmin === 'function') await initAdmin();
            }
        },

        // ============================================================
        // 审批轮询（15s，仅 manager/hr/admin）
        // ============================================================
        startApprovalPolling() {
            if (this.approvalPollTimer) return;
            const approver = this.identity;
            // 首次立即检查
            this._pollApprovals(approver);
            // 之后每 15s 轮询
            this.approvalPollTimer = setInterval(() => this._pollApprovals(approver), 15000);
        },

        stopApprovalPolling() {
            if (this.approvalPollTimer) {
                clearInterval(this.approvalPollTimer);
                this.approvalPollTimer = null;
            }
        },

        async _pollApprovals(approver) {
            try {
                const res = await fetch('/api/approvals/pending?approver=' + encodeURIComponent(approver));
                const data = await res.json();
                if (!data.success) return;
                const items = data.items || [];
                const actionableCount = items.filter(i => i.actionable !== false).length;

                // 新增通知（仅当有新的可操作审批时）
                if (actionableCount > this.pendingApprovalCount && this._lastApprovalCount >= 0) {
                    const delta = actionableCount - this.pendingApprovalCount;
                    if (delta > 0) {
                        showToast('📋 ' + delta + ' 条新审批待处理', 'info', 4000);
                    }
                }
                this._lastApprovalCount = this.pendingApprovalCount;
                this.pendingApprovalCount = actionableCount;
            } catch (e) { /* 静默失败 */ }
        },

        // ============================================================
        // 初始化
        // ============================================================
        init() {
            // 监听 approval.js 的 CustomEvent（切到审批 Tab 时同步 badge）
            window.addEventListener('approval-count', (e) => {
                if (e.detail) {
                    this.pendingApprovalCount = e.detail.count || 0;
                    this._lastApprovalCount = this.pendingApprovalCount;
                }
            });

            // 审批角色启动轮询
            const r = this.role;
            if (r === 'manager' || r === 'hr' || r === 'admin') {
                this.startApprovalPolling();
            }

            // 初始化当前可见 Tab
            this.onTabChange();
        },

        // 组件销毁时清理
        destroy() {
            this.stopApprovalPolling();
            window.removeEventListener('approval-count', () => {});
        },
    }));
});

// Clean up polling on page unload
window.addEventListener('beforeunload', () => {
    const shell = document.querySelector('[x-data="spaApp()"]');
    if (shell && shell._x_dataStack && shell._x_dataStack[0]) {
        shell._x_dataStack[0].stopApprovalPolling();
    }
});

// Keyboard shortcut for Chat
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey && document.activeElement === document.getElementById('user-input')) {
        e.preventDefault();
        if (typeof sendMessage === 'function') sendMessage();
    }
});
</script>
</body>
</html>
