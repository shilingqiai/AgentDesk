<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会议室预定 — 企业智能服务台</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        :root {
            --bg-primary: #f5f6fa;
            --bg-sidebar: #1a1a2e;
            --bg-card: #ffffff;
            --bg-input: #f0f2f5;
            --text-primary: #2d3436;
            --text-secondary: #636e72;
            --text-sidebar: #dfe6e9;
            --text-sidebar-muted: #a4b0be;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #e17055;
            --info: #74b9ff;
            --border: #e1e4e8;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary); height: 100vh; display: flex; flex-direction: column; overflow: hidden;
            color: var(--text-primary);
        }

        /* === SIDEBAR === */
        .sidebar {
            width: 280px; min-width: 280px;
            background: var(--bg-sidebar); color: var(--text-sidebar);
            display: flex; flex-direction: column; overflow-y: auto;
        }
        .sidebar-header {
            padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar-title { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
        .sidebar-title i { color: var(--accent-light); }
        .nav-links { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .nav-links a {
            display: block; color: var(--text-sidebar-muted); text-decoration: none;
            font-size: 13px; padding: 8px 12px; border-radius: 6px; transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active { color: #fff; background: rgba(255,255,255,0.06); }
        .nav-links a i { margin-right: 8px; width: 16px; text-align: center; }

        .room-list { flex: 1; padding: 12px 16px; overflow-y: auto; }
        .room-card {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius-sm); padding: 14px; margin-bottom: 8px;
            cursor: pointer; transition: all 0.2s;
        }
        .room-card:hover { background: rgba(255,255,255,0.08); transform: translateX(2px); }
        .room-card.selected { background: rgba(108,92,231,0.15); border-color: var(--accent); }
        .room-card .room-name { font-size: 14px; font-weight: 600; color: #fff; margin-bottom: 4px; }
        .room-card .room-loc { font-size: 12px; color: var(--text-sidebar-muted); }
        .room-card .room-meta { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; color: var(--text-sidebar-muted); }
        .room-card .room-meta span { display: flex; align-items: center; gap: 3px; }
        .room-card .room-amenities { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
        .amenity-tag {
            font-size: 10px; padding: 2px 8px; border-radius: 8px;
            background: rgba(255,255,255,0.08); color: var(--text-sidebar-muted);
        }

        /* === MAIN === */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
        .topbar {
            background: var(--bg-card); padding: 14px 24px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow);
        }
        .topbar-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .topbar-actions { display: flex; align-items: center; gap: 8px; }

        .btn {
            padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border);
            background: var(--bg-card); cursor: pointer; font-size: 13px; display: inline-flex;
            align-items: center; gap: 6px; transition: all 0.2s; color: var(--text-primary);
            font-family: inherit; white-space: nowrap;
        }
        .btn:hover { background: var(--bg-input); }
        .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn.primary:hover { background: #5b4cdb; }
        .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
        .btn.sm { padding: 4px 10px; font-size: 12px; }

        /* === CONTENT: Multi-Day View === */
        .content { flex: 1; overflow: hidden; display: flex; flex-direction: column; padding: 20px; }

        .selected-room-header {
            background: var(--bg-card); border-radius: var(--radius); padding: 16px 20px;
            margin-bottom: 16px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px;
            flex-shrink: 0;
        }
        .selected-room-header .room-icon {
            width: 48px; height: 48px; border-radius: 12px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: #fff; flex-shrink: 0;
        }
        .selected-room-header .info { flex: 1; }
        .selected-room-header .info h3 { font-size: 16px; margin-bottom: 2px; }
        .selected-room-header .info p { font-size: 12px; color: var(--text-secondary); }

        /* Day Columns Container */
        .day-columns {
            flex: 1; display: flex; gap: 12px; overflow-x: auto; overflow-y: hidden;
            padding-bottom: 8px;
        }
        .day-column {
            flex: 1; min-width: 140px; max-width: 220px;
            background: var(--bg-card); border-radius: var(--radius-sm);
            box-shadow: var(--shadow); display: flex; flex-direction: column;
            overflow: hidden;
        }
        .day-column.today { border-top: 3px solid var(--accent); }

        .day-column-header {
            padding: 10px 12px 6px; text-align: center; border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .day-column-header .weekday { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .day-column-header .date { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
        .day-column.today .weekday { color: var(--accent); }

        .day-column-slots {
            flex: 1; overflow-y: auto; padding: 4px;
        }
        .slot-cell {
            display: flex; align-items: center; justify-content: space-between;
            padding: 5px 8px; margin: 2px 0; border-radius: 4px;
            font-size: 12px; cursor: pointer; transition: all 0.15s;
            min-height: 32px;
        }
        .slot-cell .time { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--text-secondary); }
        .slot-cell .status-icon { font-size: 14px; flex-shrink: 0; }

        .slot-cell.available { background: rgba(0,184,148,0.06); border: 1px solid transparent; }
        .slot-cell.available:hover { background: rgba(0,184,148,0.14); border-color: var(--success); }

        .slot-cell.booked {
            background: rgba(225,112,85,0.08); border: 1px solid transparent;
            cursor: not-allowed;
        }
        .slot-cell.booked .booked-info {
            font-size: 10px; color: var(--danger); max-width: 70px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .slot-cell.past {
            background: rgba(0,0,0,0.02); cursor: default; opacity: 0.5;
        }

        /* Legend */
        .legend {
            display: flex; gap: 20px; margin-top: 12px; padding: 8px 14px;
            background: var(--bg-card); border-radius: var(--radius-sm);
            font-size: 12px; color: var(--text-secondary); flex-shrink: 0;
        }
        .legend span { display: flex; align-items: center; gap: 6px; }
        .legend .dot {
            width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0;
        }
        .legend .dot.avail { background: rgba(0,184,148,0.14); border: 1px solid var(--success); }
        .legend .dot.bkd { background: rgba(225,112,85,0.12); border: 1px solid rgba(225,112,85,0.3); }

        /* Empty State */
        .timeline-empty {
            text-align: center; padding: 80px 20px; color: var(--text-secondary);
        }
        .timeline-empty i { font-size: 48px; display: block; margin-bottom: 16px; opacity: 0.3; }
        .timeline-empty h3 { margin-bottom: 8px; }

        /* === BOOKING MODAL === */
        .modal-overlay {
            display: none; position: fixed; z-index: 100; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.4);
            justify-content: center; align-items: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-card); border-radius: var(--radius); padding: 28px;
            width: 90%; max-width: 480px; box-shadow: var(--shadow-lg);
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .modal h3 { margin-bottom: 20px; font-size: 18px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; color: var(--text-secondary); }
        .form-control {
            width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm);
            font-size: 14px; font-family: inherit; outline: none; background: var(--bg-card);
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: var(--accent); }

        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 200;
            padding: 12px 20px; border-radius: var(--radius-sm); color: #fff; font-size: 14px;
            box-shadow: var(--shadow-lg); animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .day-column { min-width: 110px; }
        }
    </style>
</head>
<body x-data="meetingApp()" x-init="init()">

{% include '_tab_nav.html' %}

<div style="display:flex; flex:1; overflow:hidden;">
<!-- Sidebar -->
<aside class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-title"><i class="fas fa-calendar-check"></i> 会议室预定</div>
    </div>
    <div class="nav-links">
        <a href="/"><i class="fas fa-comments"></i> 智能服务台</a>
        <a href="/tickets"><i class="fas fa-clipboard-list"></i> 工单管理</a>
        <a href="/meeting-rooms" class="active"><i class="fas fa-door-open"></i> 会议室预定</a>
    </div>

    <div class="room-list">
        <template x-for="room in rooms" :key="room.id">
            <div class="room-card"
                 :class="{ selected: selectedRoom && selectedRoom.id === room.id }"
                 @click="selectRoom(room)">
                <div class="room-name" x-text="room.name"></div>
                <div class="room-loc"><i class="fas fa-map-marker-alt"></i> <span x-text="room.location"></span></div>
                <div class="room-meta">
                    <span><i class="fas fa-user"></i> <span x-text="room.capacity + '人'"></span></span>
                    <span x-show="room.status === 'available'" style="color:#00b894;">● 可预定</span>
                    <span x-show="room.status !== 'available'" style="color:#e17055;">● <span x-text="room.status"></span></span>
                </div>
                <div class="room-amenities">
                    <template x-for="a in room.amenities" :key="a">
                        <span class="amenity-tag" x-text="a"></span>
                    </template>
                </div>
            </div>
        </template>
    </div>
</aside>

<!-- Main -->
<div class="main">
    <div class="topbar">
        <div class="topbar-title">
            <i class="fas fa-building" style="color:var(--accent);"></i>
            <span x-text="selectedRoom ? selectedRoom.name + ' · 近5天可用时段' : '请选择会议室'"></span>
        </div>
        <div class="topbar-actions">
            <span style="font-size:12px;color:var(--text-secondary);" x-show="dateRangeLabel" x-text="dateRangeLabel"></span>
            <button class="btn" @click="loadMultiDay()">
                <i class="fas fa-sync-alt"></i> 刷新
            </button>
        </div>
    </div>

    <div class="content">
        <!-- No room selected -->
        <div class="timeline-empty" x-show="!selectedRoom">
            <i class="fas fa-door-open"></i>
            <h3>选择左侧会议室查看近5天可用时段</h3>
            <p>点击空白时段即可快速预定</p>
        </div>

        <!-- Room selected — Multi-Day Columns -->
        <template x-if="selectedRoom">
            <div style="display:flex;flex-direction:column;flex:1;min-height:0;">
                <div class="selected-room-header">
                    <div class="room-icon"><i class="fas fa-door-open"></i></div>
                    <div class="info">
                        <h3 x-text="selectedRoom.name"></h3>
                        <p>
                            <i class="fas fa-map-marker-alt"></i> <span x-text="selectedRoom.location"></span> &nbsp;
                            <i class="fas fa-user"></i> <span x-text="selectedRoom.capacity + '人'"></span> &nbsp;
                            <span x-text="selectedRoom.description"></span>
                        </p>
                    </div>
                    <div style="display:flex;flex-wrap:wrap;gap:4px;">
                        <template x-for="a in selectedRoom.amenities" :key="a">
                            <span class="amenity-tag" x-text="a"></span>
                        </template>
                    </div>
                </div>

                <!-- Day Columns -->
                <div class="day-columns" x-show="dayColumns.length > 0" id="dayColumnsContainer">
                    <template x-for="(col, ci) in dayColumns" :key="col.date">
                        <div class="day-column" :class="{ today: col.isToday }">
                            <div class="day-column-header">
                                <div class="weekday" x-text="col.weekday"></div>
                                <div class="date" x-text="col.dateLabel"></div>
                            </div>
                            <div class="day-column-slots"
                                 x-show="!col.loading"
                                 :id="'col-slots-' + ci">
                                <template x-for="slot in col.slots" :key="slot.start">
                                    <div class="slot-cell"
                                         :class="{
                                             available: slot.available && !slot.isPast,
                                             booked: !slot.available,
                                             past: slot.isPast
                                         }"
                                         :title="slot.booked_title || ''"
                                         @click="slot.available && !slot.isPast && openBooking(col.date, slot)">
                                        <span class="time" x-text="slot.start"></span>
                                        <span class="status-icon" x-show="slot.available && !slot.isPast" style="color:var(--success);">✓</span>
                                        <span class="status-icon" x-show="!slot.available && !slot.isPast">✗</span>
                                        <span class="booked-info" x-show="!slot.available" x-text="slot.booked_title || '已预定'"></span>
                                    </div>
                                </template>
                            </div>
                            <div class="timeline-empty" x-show="col.loading" style="padding:20px;">
                                <i class="fas fa-spinner fa-spin"></i>
                            </div>
                        </div>
                    </template>
                </div>

                <div class="legend" x-show="dayColumns.length > 0">
                    <span><span class="dot avail"></span> 可预定</span>
                    <span><span class="dot bkd"></span> 已预定</span>
                    <span style="opacity:0.5;">○ 已过时</span>
                    <span style="margin-left:auto;font-size:11px;">点击 ✓ 时段即可预定</span>
                </div>
            </div>
        </template>
    </div>
</div>

<!-- Booking Modal -->
<div class="modal-overlay" :class="{ open: showModal }" @click.self="showModal = false">
    <div class="modal">
        <h3><i class="fas fa-calendar-plus" style="color:var(--accent);"></i> 预定会议室</h3>
        <form @submit.prevent="submitBooking()">
            <div class="form-group">
                <label>会议室</label>
                <input type="text" class="form-control" :value="selectedRoom?.name" disabled>
            </div>
            <div class="form-group">
                <label>日期</label>
                <input type="text" class="form-control" x-model="bookingForm.date" disabled>
            </div>
            <div class="form-group">
                <label>时间段</label>
                <input type="text" class="form-control"
                       :value="bookingForm.start_time + ' - ' + bookingForm.end_time" disabled>
            </div>
            <div class="form-group">
                <label>会议主题 <span style="color:var(--danger);">*</span></label>
                <input type="text" class="form-control" x-model="bookingForm.title" required
                       placeholder="输入会议主题..." maxlength="100">
            </div>
            <div class="form-group">
                <label>预定人</label>
                <input type="text" class="form-control" x-model="bookingForm.booked_by"
                       placeholder="您的姓名">
            </div>
            <div class="form-group">
                <label>备注</label>
                <textarea class="form-control" x-model="bookingForm.description" rows="2"
                          placeholder="会议描述（可选）"></textarea>
            </div>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:20px;">
                <button type="button" class="btn" @click="showModal = false">取消</button>
                <button type="submit" class="btn primary" :disabled="submitting">
                    <i class="fas fa-check"></i>
                    <span x-text="submitting ? '预定中...' : '确认预定'"></span>
                </button>
            </div>
        </form>
    </div>
</div>
</div><!-- end wrapper -->

<!-- Toast -->
<div class="toast" :class="toast.type" x-show="toast.show" x-text="toast.message"
     style="display:none;" x-init="$watch('toast.show', v => { if(v) setTimeout(() => toast.show = false, 3000) })"></div>

<script>
function meetingApp() {
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

    function formatDate(d) {
        return d.toISOString().split('T')[0];
    }

    return {
        rooms: [],
        selectedRoom: null,
        dayColumns: [],
        dateRangeLabel: '',
        showModal: false,
        submitting: false,
        bookingForm: { date: '', start_time: '', end_time: '', title: '', booked_by: '', description: '' },
        toast: { show: false, message: '', type: 'success' },

        async init() {
            await this.loadRooms();
        },

        async loadRooms() {
            try {
                const res = await fetch('/api/meeting-rooms/');
                const data = await res.json();
                this.rooms = data.data || [];
            } catch (e) {
                this.showToast('加载会议室失败', 'error');
            }
        },

        async selectRoom(room) {
            this.selectedRoom = room;
            this.dayColumns = [];
            await this.loadMultiDay();
        },

        async loadMultiDay() {
            if (!this.selectedRoom) return;

            // Build 5 days: today through today+4
            const days = [];
            for (let i = 0; i < 5; i++) {
                const d = new Date(today);
                d.setDate(d.getDate() + i);
                const dateStr = formatDate(d);
                days.push({
                    date: dateStr,
                    dateLabel: `${d.getMonth() + 1}/${d.getDate()}`,
                    weekday: i === 0 ? '今天' : weekdays[d.getDay()],
                    isToday: i === 0,
                    slots: [],
                    loading: true,
                });
            }
            this.dayColumns = days;
            this.dateRangeLabel = `${days[0].dateLabel} — ${days[4].dateLabel}`;

            // Load all 5 days in parallel
            const results = await Promise.allSettled(
                days.map(d =>
                    fetch(`/api/meeting-rooms/${this.selectedRoom.id}/availability?date=${d.date}`)
                        .then(r => r.json())
                )
            );

            const now = new Date();
            results.forEach((result, i) => {
                if (result.status === 'fulfilled' && result.value?.data) {
                    const slots = (result.value.data.slots || []).map(s => {
                        const [sh, sm] = s.start.split(':').map(Number);
                        const slotDt = new Date(today.getFullYear(), today.getMonth(), today.getDate(), sh, sm);
                        // Only mark as past if the date matches today AND time is past
                        const isPastDay = days[i].date < todayStr;
                        const isPastTime = days[i].date === todayStr && slotDt <= now;
                        return {
                            ...s,
                            isPast: isPastDay || isPastTime,
                        };
                    });
                    this.dayColumns[i].slots = slots;
                }
                this.dayColumns[i].loading = false;
            });
        },

        openBooking(dateStr, slot) {
            if (!this.selectedRoom) return;
            this.bookingForm = {
                date: dateStr,
                start_time: slot.start,
                end_time: slot.end,
                title: '',
                booked_by: '',
                description: '',
            };
            this.showModal = true;
        },

        async submitBooking() {
            if (!this.bookingForm.title.trim()) {
                this.showToast('请输入会议主题', 'error');
                return;
            }
            if (!this.selectedRoom) return;

            this.submitting = true;
            try {
                const res = await fetch(`/api/meeting-rooms/${this.selectedRoom.id}/book`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        date: this.bookingForm.date,
                        start_time: this.bookingForm.start_time,
                        end_time: this.bookingForm.end_time,
                        title: this.bookingForm.title,
                        description: this.bookingForm.description,
                        booked_by: this.bookingForm.booked_by,
                    }),
                });
                const data = await res.json();
                if (res.ok) {
                    this.showToast('会议室预定成功！', 'success');
                    this.showModal = false;
                    await this.loadMultiDay();
                } else {
                    this.showToast(data.detail || '预定失败', 'error');
                }
            } catch (e) {
                this.showToast('预定请求失败', 'error');
            } finally {
                this.submitting = false;
            }
        },

        showToast(message, type) {
            this.toast = { show: true, message, type };
        },
    };
}
</script>
</body>
</html>
