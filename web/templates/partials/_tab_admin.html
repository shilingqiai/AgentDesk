<!-- _tab_admin.html — Admin Dashboard (v13 enhanced) -->
<div>
    <div class="topbar" style="margin-bottom:12px;">
        <span class="topbar-title">⚙ 管理仪表盘</span>
    </div>

    <!-- ═══ 1. 系统概览 ═══ -->
    <div class="stats-row" style="margin-bottom:24px;">
        <div class="stat-card">
            <div class="num total" id="admin-stat-total">-</div>
            <div class="label">总工单</div>
        </div>
        <div class="stat-card">
            <div class="num pending" id="admin-stat-open">-</div>
            <div class="label">进行中</div>
        </div>
        <div class="stat-card">
            <div class="num approved" id="admin-stat-resolved">-</div>
            <div class="label">已完成</div>
        </div>
        <div class="stat-card">
            <div class="num rejected" id="admin-stat-high">-</div>
            <div class="label">高优先级</div>
        </div>
    </div>

    <!-- ═══ 2. Agent 状态 ═══ -->
    <div class="section-title">🤖 Agent 运行状态</div>
    <div id="admin-agent-list" style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;">
        <div style="padding:12px;color:var(--text-secondary);font-size:13px;">加载中...</div>
    </div>

    <!-- ═══ 3. 工具注册中心 ═══ -->
    <div class="section-title">🔧 Agent 工具注册中心</div>
    <div id="admin-tools-list" style="margin-bottom:20px;">
        <div style="padding:12px;color:var(--text-secondary);font-size:13px;">加载中...</div>
    </div>

    <!-- ═══ 3.5. 执行追踪 ═══ -->
    <div class="section-title">📊 ReAct 执行追踪 <span style="font-size:11px;color:var(--text-muted);font-weight:400;">（最近 N 条）</span></div>
    <div id="admin-traces-list" style="margin-bottom:20px;">
        <div style="padding:12px;color:var(--text-secondary);font-size:13px;">加载中...</div>
    </div>

    <!-- ═══ 4. SLA 超时告警 ═══ -->
    <div class="section-title">⏰ SLA 超时监控</div>
    <div id="admin-sla-status" style="margin-bottom:20px;">
        <div style="padding:12px;color:var(--text-secondary);font-size:13px;">加载中...</div>
    </div>

    <!-- ═══ 4. 审批链实时状态 ═══ -->
    <div class="section-title">🔗 审批链状态（实时）</div>
    <div id="admin-approval-chains" style="margin-bottom:20px;">
        <div style="padding:12px;color:var(--text-secondary);font-size:13px;">加载中...</div>
    </div>

    <!-- ═══ 5. 最近事件 ═══ -->
    <div class="section-title">📡 最近事件</div>
    <div id="admin-events-timeline" style="margin-bottom:20px;">
        <div style="padding:12px;color:var(--text-secondary);font-size:13px;">加载中...</div>
    </div>

    <!-- ═══ 6. 最近工单（全量） ═══ -->
    <div class="section-title">📋 最近工单（全量，不限申请人）</div>
    <div id="admin-recent-tickets">
        <div style="padding:12px;color:var(--text-secondary);font-size:13px;">加载中...</div>
    </div>
</div>
