<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理 — 企业智能服务台</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f5f6fa;
            --bg-sidebar: #1a1a2e;
            --bg-card: #ffffff;
            --bg-input: #f0f2f5;
            --text-primary: #2d3436;
            --text-secondary: #636e72;
            --text-sidebar: #dfe6e9;
            --text-sidebar-muted: #a4b0be;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #e17055;
            --info: #74b9ff;
            --border: #e1e4e8;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            height: 100vh; display: flex; overflow: hidden; color: var(--text-primary);
        }

        /* === SIDEBAR === */
        .sidebar {
            width: 260px; min-width: 260px;
            background: var(--bg-sidebar); color: var(--text-sidebar);
            display: flex; flex-direction: column; overflow-y: auto;
        }
        .sidebar-header {
            padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar-title { font-size: 15px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
        .sidebar-title i { color: var(--accent-light); }
        .sidebar-back {
            display: block; color: var(--text-sidebar-muted); text-decoration: none;
            font-size: 12px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .sidebar-back:hover { color: #fff; background: rgba(255,255,255,0.04); }

        .sidebar-section { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .sidebar-section-title {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
            color: var(--text-sidebar-muted); margin-bottom: 10px; font-weight: 600;
        }
        .stat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; }
        .stat-row .value { color: #fff; font-weight: 600; }

        .cat-item {
            padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
            color: var(--text-sidebar-muted); margin-bottom: 2px; transition: all var(--transition);
            display: flex; align-items: center; justify-content: space-between;
        }
        .cat-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .cat-item.active { background: rgba(108,92,231,0.2); color: #fff; }
        .cat-item .count { font-size: 11px; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 10px; }

        /* === MAIN === */
        .main {
            flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden;
        }
        .topbar {
            background: var(--bg-card); padding: 14px 24px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow);
        }
        .topbar-title { font-size: 16px; font-weight: 600; }

        /* === CONTENT: split view === */
        .content { flex: 1; display: flex; overflow: hidden; }

        /* --- List panel (left 60%) --- */
        .list-panel {
            flex: 3; padding: 20px; overflow-y: auto; border-right: 1px solid var(--border);
        }
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .list-header h3 { font-size: 16px; }

        .knowledge-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 16px; margin-bottom: 10px; box-shadow: var(--shadow); transition: all var(--transition);
        }
        .knowledge-card:hover { border-color: var(--accent); transform: translateX(2px); }
        .knowledge-card .kc-content { font-size: 14px; line-height: 1.6; margin-bottom: 10px; color: var(--text-primary); }
        .knowledge-card .kc-meta {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            font-size: 12px; color: var(--text-secondary);
        }
        .kc-badge {
            padding: 2px 10px; border-radius: 10px; font-size: 11px; font-weight: 600;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: #fff;
        }
        .kc-tag {
            padding: 2px 8px; border-radius: 6px; font-size: 11px;
            background: var(--bg-input); color: var(--text-secondary);
        }
        .kc-actions { margin-top: 10px; display: flex; gap: 8px; }

        /* --- Search panel (right 40%) --- */
        .search-panel {
            flex: 2; padding: 20px; overflow-y: auto; background: #fafbfc;
        }
        .search-panel h3 { font-size: 15px; margin-bottom: 14px; }
        .search-timing {
            font-size: 12px; color: var(--text-secondary); margin-top: 8px;
            display: flex; align-items: center; gap: 4px;
        }
        .search-timing .fast { color: var(--success); font-weight: 600; }
        .search-timing .slow { color: var(--warning); font-weight: 600; }

        .search-result-card {
            background: var(--bg-card); border-left: 4px solid var(--accent);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 14px;
            margin-bottom: 10px; box-shadow: var(--shadow);
        }
        .search-result-card .score {
            font-size: 11px; padding: 2px 8px; border-radius: 8px;
            background: linear-gradient(135deg, #00b894, #55efc4); color: #fff;
            font-weight: 600; float: right;
        }
        .no-results { text-align: center; color: var(--text-secondary); padding: 40px 20px; }
        .no-results i { font-size: 40px; display: block; margin-bottom: 12px; opacity: 0.3; }

        /* === FORMS === */
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 600; font-size: 13px; }
        .form-control {
            width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: var(--radius-sm);
            font-size: 13px; font-family: inherit; outline: none; background: var(--bg-card);
            transition: border-color var(--transition);
        }
        .form-control:focus { border-color: var(--accent); }

        .btn {
            padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border);
            background: var(--bg-card); cursor: pointer; font-size: 13px; display: inline-flex;
            align-items: center; gap: 6px; transition: all var(--transition); color: var(--text-primary);
        }
        .btn:hover { background: var(--bg-input); }
        .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn.primary:hover { background: #5b4cdb; }
        .btn.success { background: var(--success); color: #fff; border-color: var(--success); }
        .btn.danger { background: var(--danger); color: #fff; border-color: var(--danger); }
        .btn.sm { padding: 4px 10px; font-size: 12px; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; z-index: 100; left: 0; top: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.4);
            justify-content: center; align-items: center;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--bg-card); border-radius: var(--radius); padding: 28px;
            width: 90%; max-width: 560px; box-shadow: var(--shadow-lg);
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .modal h3 { margin-bottom: 16px; }

        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 200;
            padding: 12px 20px; border-radius: var(--radius-sm); color: #fff; font-size: 14px;
            box-shadow: var(--shadow-lg); animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }

        .pagination { display: flex; justify-content: center; gap: 4px; margin-top: 16px; }
        .pagination button {
            padding: 6px 12px; border: 1px solid var(--border); background: var(--bg-card);
            border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .pagination button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }
        .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .content { flex-direction: column; }
            .list-panel { border-right: none; border-bottom: 1px solid var(--border); }
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-title"><i class="fas fa-brain"></i> 知识库管理</div>
    </div>
    <a href="/" class="sidebar-back"><i class="fas fa-arrow-left"></i> 返回智能服务台</a>

    <div class="sidebar-section">
        <div class="sidebar-section-title">统计</div>
        <div class="stat-row"><span>文档总数</span><span class="value" id="statTotal">-</span></div>
        <div class="stat-row"><span>分类数</span><span class="value" id="statCats">-</span></div>
    </div>

    <div class="sidebar-section" style="flex:1;">
        <div class="sidebar-section-title">分类筛选</div>
        <div class="cat-item active" data-cat="" onclick="filterByCategory('')">
            📚 全部 <span class="count" id="catCountAll">-</span>
        </div>
        <div id="catList"></div>
    </div>
</aside>

<!-- Main -->
<div class="main">
    <div class="topbar">
        <span class="topbar-title"><i class="fas fa-database"></i> AI 知识库 — 文档管理 & 向量检索</span>
        <div>
            <button class="btn primary" onclick="openAddModal()"><i class="fas fa-plus"></i> 添加知识</button>
        </div>
    </div>

    <div class="content">
        <!-- Document List -->
        <div class="list-panel" id="listPanel">
            <div class="list-header">
                <h3 id="listTitle">📝 全部文档</h3>
                <span style="font-size:12px;color:var(--text-secondary);" id="pageInfo"></span>
            </div>
            <div id="docList"><div class="no-results"><i class="fas fa-spinner fa-spin"></i> 加载中...</div></div>
            <div class="pagination" id="pagination"></div>
        </div>

        <!-- Search Panel -->
        <div class="search-panel">
            <h3>🔍 向量搜索测试</h3>
            <div class="form-group">
                <label>搜索查询</label>
                <input type="text" id="searchQuery" class="form-control" placeholder="输入自然语言查询...">
            </div>
            <div style="display:flex;gap:10px;">
                <div class="form-group" style="flex:1;">
                    <label>返回条数</label>
                    <select id="searchTopK" class="form-control">
                        <option value="3">3条</option>
                        <option value="5" selected>5条</option>
                        <option value="10">10条</option>
                    </select>
                </div>
                <div class="form-group" style="flex:1;">
                    <label>分类过滤</label>
                    <select id="searchCategory" class="form-control">
                        <option value="">全部分类</option>
                    </select>
                </div>
            </div>
            <button class="btn primary" onclick="doSearch()"><i class="fas fa-search"></i> 搜索</button>
            <div id="searchTiming" class="search-timing"></div>
            <hr style="margin:16px 0;border-color:var(--border);">
            <div id="searchResults">
                <div class="no-results"><i class="fas fa-search"></i> 输入查询开始搜索</div>
            </div>
        </div>
    </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h3 id="modalTitle">➕ 添加知识</h3>
        <form id="editForm">
            <input type="hidden" id="editId">
            <div class="form-group">
                <label>知识内容</label>
                <textarea id="editContent" class="form-control" rows="4" required placeholder="输入知识内容..."></textarea>
            </div>
            <div class="form-group">
                <label>分类</label>
                <input type="text" id="editCategory" class="form-control" required placeholder="如：网络故障、HR政策">
            </div>
            <div class="form-group">
                <label>关键词（逗号分隔）</label>
                <input type="text" id="editKeywords" class="form-control" placeholder="如：VPN,排查,连接">
            </div>
            <div style="display:flex;gap:8px;justify-content:flex-end;">
                <button type="button" class="btn" onclick="closeModal()">取消</button>
                <button type="submit" class="btn success">💾 保存</button>
            </div>
        </form>
    </div>
</div>

<!-- Toast -->
<div id="toast" class="toast" style="display:none;"></div>

<script>
// ===== State =====
let allDocs = [];
let categories = [];
let currentCat = '';
let currentPage = 1;
const PAGE_SIZE = 8;

// ===== Init =====
document.addEventListener('DOMContentLoaded', () => {
    loadData();
    document.getElementById('editForm').addEventListener('submit', handleSave);
    document.getElementById('searchQuery').addEventListener('keydown', e => {
        if (e.key === 'Enter') doSearch();
    });
});

// ===== Data Loading =====
async function loadData() {
    try {
        const res = await fetch('/api/knowledge');
        const data = await res.json();
        allDocs = data.documents || [];
        categories = data.categories || [];

        document.getElementById('statTotal').textContent = allDocs.length;
        document.getElementById('statCats').textContent = categories.length;
        document.getElementById('catCountAll').textContent = allDocs.length;

        renderCategories();
        renderDocs();
        updateCategorySelect();
    } catch (e) {
        console.error('加载失败:', e);
        toast('加载数据失败', 'error');
    }
}

// ===== Categories =====
function renderCategories() {
    const groups = {};
    allDocs.forEach(d => { const c = d.category || '未分类'; groups[c] = (groups[c]||0)+1; });
    const el = document.getElementById('catList');
    el.innerHTML = Object.entries(groups).map(([cat, count]) => `
        <div class="cat-item" data-cat="${cat}" onclick="filterByCategory('${cat.replace(/'/g,"\\'")}')">
            📁 ${cat} <span class="count">${count}</span>
        </div>
    `).join('');
}

function filterByCategory(cat) {
    currentCat = cat; currentPage = 1;
    document.querySelectorAll('.cat-item').forEach(c => {
        c.classList.toggle('active', c.dataset.cat === cat);
    });
    document.getElementById('listTitle').textContent = cat ? `📁 ${cat}` : '📝 全部文档';
    renderDocs();
}

// ===== Document List with Pagination =====
function renderDocs() {
    let docs = currentCat ? allDocs.filter(d => (d.category||'未分类') === currentCat) : allDocs;
    const totalPages = Math.ceil(docs.length / PAGE_SIZE) || 1;
    const start = (currentPage-1) * PAGE_SIZE;
    const pageDocs = docs.slice(start, start + PAGE_SIZE);

    document.getElementById('pageInfo').textContent = `共 ${docs.length} 条 · 第 ${currentPage}/${totalPages} 页`;

    const el = document.getElementById('docList');
    if (!pageDocs.length) {
        el.innerHTML = '<div class="no-results"><i class="fas fa-inbox"></i> 暂无文档</div>';
        document.getElementById('pagination').innerHTML = '';
        return;
    }

    el.innerHTML = pageDocs.map(d => `
        <div class="knowledge-card">
            <div class="kc-content">${escapeHtml(d.content)}</div>
            <div class="kc-meta">
                <span>ID: ${d.id}</span>
                <span class="kc-badge">${escapeHtml(d.category||'未分类')}</span>
                <span>${(d.keywords||[]).map(k => `<span class="kc-tag">${escapeHtml(k)}</span>`).join(' ')}</span>
                <span style="margin-left:auto;">更新: ${fmtDate(d.updated_at)}</span>
            </div>
            <div class="kc-actions">
                <button class="btn sm" onclick="openEditModal(${d.id})">✏️ 编辑</button>
                <button class="btn sm danger" onclick="deleteDoc(${d.id})">🗑️ 删除</button>
            </div>
        </div>
    `).join('');

    // Pagination
    let phtml = '';
    phtml += `<button ${currentPage===1?'disabled':''} onclick="goPage(${currentPage-1})">‹</button>`;
    for (let p = 1; p <= totalPages; p++) {
        phtml += `<button class="${p===currentPage?'active':''}" onclick="goPage(${p})">${p}</button>`;
    }
    phtml += `<button ${currentPage===totalPages?'disabled':''} onclick="goPage(${currentPage+1})">›</button>`;
    document.getElementById('pagination').innerHTML = phtml;
}

function goPage(p) { currentPage = p; renderDocs(); document.getElementById('listPanel').scrollTop = 0; }

// ===== Search =====
async function doSearch() {
    const query = document.getElementById('searchQuery').value.trim();
    if (!query) return;

    const topK = parseInt(document.getElementById('searchTopK').value);
    const category = document.getElementById('searchCategory').value;
    const startTime = performance.now();

    try {
        const res = await fetch('/api/knowledge/search', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({query, top_k: topK, category: category || null}),
        });
        const data = await res.json();
        const elapsed = (performance.now() - startTime).toFixed(0);

        // Timing display
        const timingEl = document.getElementById('searchTiming');
        const cls = elapsed < 500 ? 'fast' : elapsed < 1500 ? '' : 'slow';
        timingEl.innerHTML = `⏱️ 搜索耗时: <span class="${cls}">${elapsed}ms</span> · ${data.total_found || data.results?.length || 0} 条结果`;

        const results = data.results || data.data || [];
        const container = document.getElementById('searchResults');
        if (!results.length) {
            container.innerHTML = `<div class="no-results"><i class="fas fa-search"></i> 未找到与 "${escapeHtml(query)}" 相关的内容</div>`;
            return;
        }

        container.innerHTML = results.map((doc, i) => `
            <div class="search-result-card">
                <span class="score">${(doc.score||0).toFixed(3)}</span>
                <div style="font-size:14px;line-height:1.6;margin-bottom:8px;">${escapeHtml(doc.content)}</div>
                <div style="font-size:12px;color:var(--text-secondary);">
                    <span class="kc-badge">${escapeHtml(doc.category||'未分类')}</span>
                    #${i+1} · ID: ${doc.id}
                </div>
            </div>
        `).join('');
    } catch (e) {
        console.error('搜索失败:', e);
        toast('搜索失败', 'error');
    }
}

// ===== CRUD =====
function openAddModal() {
    document.getElementById('modalTitle').textContent = '➕ 添加知识';
    document.getElementById('editId').value = '';
    document.getElementById('editContent').value = '';
    document.getElementById('editCategory').value = '';
    document.getElementById('editKeywords').value = '';
    document.getElementById('editModal').classList.add('open');
}

function openEditModal(id) {
    const doc = allDocs.find(d => d.id === id);
    if (!doc) return;
    document.getElementById('modalTitle').textContent = '✏️ 编辑知识';
    document.getElementById('editId').value = id;
    document.getElementById('editContent').value = doc.content || '';
    document.getElementById('editCategory').value = doc.category || '';
    document.getElementById('editKeywords').value = (doc.keywords||[]).join(', ');
    document.getElementById('editModal').classList.add('open');
}

function closeModal() { document.getElementById('editModal').classList.remove('open'); }

async function handleSave(e) {
    e.preventDefault();
    const id = document.getElementById('editId').value;
    const content = document.getElementById('editContent').value.trim();
    const category = document.getElementById('editCategory').value.trim();
    const keywords = document.getElementById('editKeywords').value.split(',').map(k=>k.trim()).filter(Boolean);

    if (!content || !category) { toast('请填写内容和分类', 'error'); return; }

    try {
        const isEdit = !!id;
        const res = await fetch(isEdit ? `/api/knowledge/${id}` : '/api/knowledge', {
            method: isEdit ? 'PUT' : 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content, category, keywords}),
        });
        if (res.ok) {
            toast(isEdit ? '更新成功' : '添加成功', 'success');
            closeModal();
            await loadData();
        } else {
            const err = await res.json();
            toast(err.detail || err.message || '操作失败', 'error');
        }
    } catch (e) {
        console.error('保存失败:', e);
        toast('保存失败', 'error');
    }
}

async function deleteDoc(id) {
    if (!confirm('确定要删除这条知识吗？')) return;
    try {
        const res = await fetch(`/api/knowledge/${id}`, {method: 'DELETE'});
        if (res.ok) { toast('删除成功', 'success'); await loadData(); }
        else { const err = await res.json(); toast(err.detail || '删除失败', 'error'); }
    } catch (e) { toast('删除失败', 'error'); }
}

// ===== Helpers =====
function updateCategorySelect() {
    const sel = document.getElementById('searchCategory');
    sel.innerHTML = '<option value="">全部分类</option>' +
        categories.map(c => `<option value="${c}">${c}</option>`).join('');
}

function toast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = `toast ${type}`; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

function escapeHtml(s) {
    const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}

function fmtDate(d) {
    if (!d) return '-';
    return new Date(d).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

// Close modal on overlay click
document.getElementById('editModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});
</script>
</body>
</html>
