<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工单管理 — 企业智能服务台</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
    <style>
        :root {
            --bg-primary: #f5f6fa;
            --bg-sidebar: #1a1a2e;
            --bg-card: #ffffff;
            --bg-input: #f0f2f5;
            --text-primary: #2d3436;
            --text-secondary: #636e72;
            --text-sidebar: #dfe6e9;
            --text-sidebar-muted: #a4b0be;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #e17055;
            --info: #74b9ff;
            --border: #e1e4e8;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary); height: 100vh; display: flex; overflow: hidden;
            color: var(--text-primary);
        }

        /* === SIDEBAR === */
        .sidebar {
            width: 260px; min-width: 260px;
            background: var(--bg-sidebar); color: var(--text-sidebar);
            display: flex; flex-direction: column; overflow-y: auto;
        }
        .sidebar-header {
            padding: 20px 16px; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .sidebar-title { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
        .sidebar-title i { color: var(--accent-light); }

        /* Identity Selector */
        .identity-selector {
            margin-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .identity-selector label {
            font-size: 11px;
            color: var(--text-sidebar-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .identity-selector select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            cursor: pointer;
        }
        .identity-selector select:focus { border-color: var(--accent); }
        .identity-selector select option { background: #1a1a2e; color: #fff; }
        .identity-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }
        .identity-badge.employee { background: rgba(0,184,148,0.15); color: #55efc4; }
        .identity-badge.admin { background: rgba(253,203,110,0.15); color: #fdcb6e; }
        .nav-links { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .nav-links a {
            display: block; color: var(--text-sidebar-muted); text-decoration: none;
            font-size: 13px; padding: 8px 12px; border-radius: 6px; transition: all 0.2s;
        }
        .nav-links a:hover, .nav-links a.active { color: #fff; background: rgba(255,255,255,0.06); }
        .nav-links a i { margin-right: 8px; width: 16px; text-align: center; }

        .sidebar-section { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .sidebar-section-title {
            font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px;
            color: var(--text-sidebar-muted); margin-bottom: 12px; font-weight: 600;
        }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-item {
            background: rgba(255,255,255,0.04); border-radius: 8px; padding: 12px 10px; text-align: center;
        }
        .stat-item .num { font-size: 20px; font-weight: 700; color: #fff; }
        .stat-item .label { font-size: 11px; color: var(--text-sidebar-muted); margin-top: 2px; }

        .filter-group { margin-bottom: 10px; }
        .filter-group label { font-size: 11px; color: var(--text-sidebar-muted); display: block; margin-bottom: 4px; }
        .filter-group select {
            width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06); color: #fff; font-size: 13px; font-family: inherit;
            outline: none; cursor: pointer;
        }
        .filter-group select option { background: #1a1a2e; color: #fff; }

        /* === MAIN === */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
        .topbar {
            background: var(--bg-card); padding: 14px 24px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; box-shadow: var(--shadow);
        }
        .topbar-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .topbar-info { font-size: 13px; color: var(--text-secondary); }

        .content { flex: 1; overflow-y: auto; padding: 20px 24px; }

        /* === TICKET CARDS === */
        .ticket-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 16px 20px; margin-bottom: 10px; box-shadow: var(--shadow);
            transition: all 0.2s; cursor: pointer;
        }
        .ticket-card:hover { border-color: var(--accent); transform: translateX(2px); }
        .ticket-card.expanded { border-color: var(--accent); box-shadow: var(--shadow-lg); }

        .ticket-header { display: flex; align-items: flex-start; gap: 12px; }
        .ticket-type-icon {
            width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center;
            justify-content: center; font-size: 16px; flex-shrink: 0;
        }
        .ticket-type-icon.it { background: linear-gradient(135deg, #0984e3, #74b9ff); color: #fff; }
        .ticket-type-icon.leave { background: linear-gradient(135deg, #fdcb6e, #f39c12); color: #fff; }
        .ticket-type-icon.expense { background: linear-gradient(135deg, #00b894, #55efc4); color: #fff; }
        .ticket-type-icon.admin { background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: #fff; }

        .ticket-info { flex: 1; min-width: 0; }
        .ticket-info .ticket-number { font-size: 11px; color: var(--text-secondary); font-family: monospace; }
        .ticket-info .ticket-title { font-size: 15px; font-weight: 600; margin: 2px 0; }
        .ticket-info .ticket-desc { font-size: 13px; color: var(--text-secondary); }
        .ticket-info .ticket-desc { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

        .ticket-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .badge {
            font-size: 11px; padding: 3px 10px; border-radius: 10px; font-weight: 600;
        }
        .badge-type {
            background: rgba(108,92,231,0.1); color: var(--accent);
        }
        .badge-priority {
            background: rgba(0,0,0,0.05); color: var(--text-secondary);
        }
        .badge-priority.P0, .badge-priority.P1 { background: rgba(225,112,85,0.1); color: var(--danger); }
        .badge-status {
            color: #fff;
        }
        .badge-status.created { background: #74b9ff; }
        .badge-status.assigned { background: #fdcb6e; color: #333; }
        .badge-status.processing { background: #6c5ce7; }
        .badge-status.resolved { background: #00b894; }
        .badge-status.closed { background: #636e72; }

        .ticket-detail {
            display: none; margin-top: 16px; padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .ticket-card.expanded .ticket-detail { display: block; }

        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .detail-item { }
        .detail-item .dl { font-size: 11px; color: var(--text-secondary); margin-bottom: 2px; }
        .detail-item .dv { font-size: 14px; }

        .detail-payload {
            margin-top: 12px; background: var(--bg-input); border-radius: var(--radius-sm); padding: 12px 16px;
        }
        .detail-payload .pl { font-size: 11px; color: var(--text-secondary); margin-bottom: 6px; }
        .detail-payload .pk { display: inline-block; padding: 3px 10px; background: var(--bg-card);
            border-radius: 6px; font-size: 12px; margin: 2px 4px 2px 0; }
        .detail-actions { margin-top: 12px; display: flex; gap: 8px; }

        /* Pagination */
        .pagination { display: flex; justify-content: center; gap: 4px; margin-top: 20px; padding-bottom: 20px; }
        .pagination button {
            padding: 6px 14px; border: 1px solid var(--border); background: var(--bg-card);
            border-radius: 4px; cursor: pointer; font-size: 13px; font-family: inherit;
        }
        .pagination button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }

        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-secondary); }
        .empty-state i { font-size: 48px; display: block; margin-bottom: 16px; opacity: 0.3; }
        .empty-state h3 { margin-bottom: 8px; }

        .btn {
            padding: 8px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border);
            background: var(--bg-card); cursor: pointer; font-size: 13px; display: inline-flex;
            align-items: center; gap: 6px; transition: all 0.2s; color: var(--text-primary);
            font-family: inherit;
        }
        .btn:hover { background: var(--bg-input); }
        .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn.success { background: var(--success); color: #fff; border-color: var(--success); }
        .btn.sm { padding: 4px 10px; font-size: 12px; }

        .toast {
            position: fixed; top: 20px; right: 20px; z-index: 200;
            padding: 12px 20px; border-radius: var(--radius-sm); color: #fff; font-size: 14px;
            box-shadow: var(--shadow-lg); animation: slideIn 0.3s ease;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 3px; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .detail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body x-data="ticketsApp()" x-init="init()">

<!-- Sidebar -->
<aside class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-title"><i class="fas fa-clipboard-list"></i> 工单管理</div>
        <div class="identity-selector">
            <label><i class="fas fa-user-circle"></i> 当前身份</label>
            <select id="identity-select" onchange="onIdentityChange()">
                <option value="张三">👤 张三 (员工)</option>
                <option value="李四">👤 李四 (员工)</option>
                <option value="王五">👤 王五 (员工)</option>
                <option value="赵六">👤 赵六 (员工)</option>
                <option value="管理员">🔸 管理员</option>
            </select>
            <div style="margin-top:4px;" id="identity-badge-display"></div>
        </div>
    </div>
    <div class="nav-links">
        <a href="/"><i class="fas fa-comments"></i> 智能服务台</a>
        <a href="/tickets" class="active"><i class="fas fa-clipboard-list"></i> 工单管理</a>
        <a href="/meeting-rooms"><i class="fas fa-door-open"></i> 会议室预定</a>
    </div>

    <div class="sidebar-section">
        <div class="sidebar-section-title">统计概览</div>
        <div class="stat-grid">
            <div class="stat-item">
                <div class="num" x-text="stats.total"></div>
                <div class="label">总计</div>
            </div>
            <div class="stat-item">
                <div class="num" x-text="stats.open"></div>
                <div class="label">处理中</div>
            </div>
            <div class="stat-item">
                <div class="num" x-text="stats.resolved"></div>
                <div class="label">已解决</div>
            </div>
            <div class="stat-item">
                <div class="num" style="color:var(--danger);" x-text="stats.high_priority"></div>
                <div class="label">高优先级</div>
            </div>
        </div>
    </div>

    <div class="sidebar-section">
        <div class="sidebar-section-title">筛选</div>
        <div class="filter-group">
            <label>工单类型</label>
            <select x-model="filters.type" @change="applyFilters()">
                <option value="">全部类型</option>
                <option value="it_fault">🔧 IT故障</option>
                <option value="leave">🏖️ 请假</option>
                <option value="expense">💰 报销</option>
                <option value="admin">🏢 行政</option>
            </select>
        </div>
        <div class="filter-group">
            <label>状态</label>
            <select x-model="filters.status" @change="applyFilters()">
                <option value="">全部状态</option>
                <option value="created">📝 已创建</option>
                <option value="assigned">👤 已指派</option>
                <option value="processing">🔄 处理中</option>
                <option value="resolved">✅ 已解决</option>
                <option value="closed">🔒 已关闭</option>
            </select>
        </div>
        <div class="filter-group">
            <label>优先级</label>
            <select x-model="filters.priority" @change="applyFilters()">
                <option value="">全部优先级</option>
                <option value="P0">🔴 P0 紧急</option>
                <option value="P1">🟠 P1 高</option>
                <option value="P2">🟡 P2 中</option>
                <option value="P3">🟢 P3 低</option>
            </select>
        </div>
    </div>
</aside>

<!-- Main -->
<div class="main">
    <div class="topbar">
        <div class="topbar-title">
            <i class="fas fa-tasks" style="color:var(--accent);"></i>
            工单列表
        </div>
        <div class="topbar-info">
            共 <strong x-text="totalCount"></strong> 条工单 ·
            第 <span x-text="currentPage"></span>/<span x-text="totalPages"></span> 页
        </div>
    </div>

    <div class="content">
        <!-- Ticket Cards -->
        <template x-for="ticket in tickets" :key="ticket.id">
            <div class="ticket-card"
                 :class="{ expanded: expandedId === ticket.id }"
                 @click="expandedId = expandedId === ticket.id ? null : ticket.id">
                <div class="ticket-header">
                    <div class="ticket-type-icon" :class="ticket.ticket_type">
                        <i :class="getTypeIcon(ticket.ticket_type)"></i>
                    </div>
                    <div class="ticket-info">
                        <div class="ticket-number" x-text="ticket.ticket_number"></div>
                        <div class="ticket-title" x-text="ticket.title"></div>
                        <div class="ticket-desc" x-text="ticket.description"></div>
                        <div class="ticket-badges">
                            <span class="badge badge-type" x-text="getTypeLabel(ticket.ticket_type)"></span>
                            <span class="badge badge-priority" :class="ticket.priority" x-text="ticket.priority"></span>
                            <span class="badge badge-status" :class="ticket.status" x-text="getStatusLabel(ticket.status)"></span>
                            <span style="font-size:11px;color:var(--text-secondary);" x-text="formatDate(ticket.created_at)"></span>
                        </div>
                    </div>
                </div>

                <!-- Expanded Detail -->
                <div class="ticket-detail" @click.stop="">
                    <div class="detail-grid">
                        <div class="detail-item">
                            <div class="dl">工单编号</div>
                            <div class="dv" style="font-family:monospace;" x-text="ticket.ticket_number"></div>
                        </div>
                        <div class="detail-item">
                            <div class="dl">分类</div>
                            <div class="dv" x-text="ticket.category"></div>
                        </div>
                        <div class="detail-item">
                            <div class="dl">申请人</div>
                            <div class="dv" x-text="ticket.requester_id || '-'"></div>
                        </div>
                        <div class="detail-item">
                            <div class="dl">指派人</div>
                            <div class="dv" x-text="ticket.assigned_to || '未指派'"></div>
                        </div>
                        <div class="detail-item">
                            <div class="dl">创建时间</div>
                            <div class="dv" x-text="formatDateFull(ticket.created_at)"></div>
                        </div>
                        <div class="detail-item">
                            <div class="dl">更新时间</div>
                            <div class="dv" x-text="formatDateFull(ticket.updated_at)"></div>
                        </div>
                    </div>

                    <!-- Payload detail -->
                    <div class="detail-payload" x-show="ticket.payload && Object.keys(ticket.payload).length > 0">
                        <div class="pl">详细信息</div>
                        <template x-for="(val, key) in ticket.payload" :key="key">
                            <span class="pk" x-text="key + ': ' + val" x-show="val"></span>
                        </template>
                    </div>

                    <div class="detail-actions">
                        <!-- Admin: approve/reject for leave tickets -->
                        <button class="btn success sm" @click.stop="approveTicket(ticket.id)"
                                x-show="isAdmin && ticket.ticket_type === 'leave'
                                        && ticket.status !== 'resolved' && ticket.status !== 'closed'">
                            ✅ 审批通过
                        </button>
                        <button class="btn sm" @click.stop="rejectTicket(ticket.id)"
                                style="background:var(--danger);color:#fff;border-color:var(--danger);"
                                x-show="isAdmin && ticket.ticket_type === 'leave'
                                        && ticket.status !== 'resolved' && ticket.status !== 'closed'">
                            ❌ 驳回
                        </button>
                        <!-- Admin: general status management -->
                        <button class="btn success sm" @click.stop="updateStatus(ticket.id, 'resolved')"
                                x-show="isAdmin && ticket.status !== 'resolved' && ticket.status !== 'closed'">
                            ✅ 标记已解决
                        </button>
                        <button class="btn sm" @click.stop="updateStatus(ticket.id, 'closed')"
                                x-show="isAdmin && ticket.status !== 'closed'">
                            🔒 关闭工单
                        </button>
                        <button class="btn sm" @click.stop="updateStatus(ticket.id, 'processing')"
                                x-show="isAdmin && (ticket.status === 'created' || ticket.status === 'assigned')">
                            🔄 开始处理
                        </button>
                        <!-- Employee: read-only note -->
                        <span x-show="!isAdmin" style="font-size:12px;color:var(--text-secondary);">
                            💡 工单状态变更请联系管理员
                        </span>
                    </div>
                </div>
            </div>
        </template>

        <!-- Empty State -->
        <div class="empty-state" x-show="!loading && tickets.length === 0">
            <i class="fas fa-inbox"></i>
            <h3>暂无工单</h3>
            <p>在智能服务台聊天中创建的工单会显示在这里</p>
        </div>

        <!-- Loading -->
        <div class="empty-state" x-show="loading">
            <i class="fas fa-spinner fa-spin"></i>
            <h3>加载中...</h3>
        </div>

        <!-- Pagination -->
        <div class="pagination" x-show="totalPages > 1">
            <button @click="goPage(1)" :disabled="currentPage <= 1">«</button>
            <button @click="goPage(currentPage - 1)" :disabled="currentPage <= 1">‹</button>
            <template x-for="p in visiblePages" :key="p">
                <button :class="{ active: p === currentPage }" @click="goPage(p)" x-text="p"></button>
            </template>
            <button @click="goPage(currentPage + 1)" :disabled="currentPage >= totalPages">›</button>
            <button @click="goPage(totalPages)" :disabled="currentPage >= totalPages">»</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" :class="toast.type" x-show="toast.show" x-text="toast.message"
     style="display:none;" x-init="$watch('toast.show', v => { if(v) setTimeout(() => toast.show = false, 3000) })"></div>

<script>
function ticketsApp() {
    return {
        tickets: [],
        stats: { total: 0, open: 0, resolved: 0, high_priority: 0 },
        totalCount: 0,
        currentPage: 1,
        totalPages: 1,
        pageSize: 10,
        expandedId: null,
        loading: false,
        filters: { type: '', status: '', priority: '' },
        toast: { show: false, message: '', type: 'success' },

        // Identity
        currentUser: loadIdentity(),
        get isAdmin() { return this.currentUser.role === 'admin'; },

        TYPE_CONFIG: {
            it_fault: { label: 'IT故障', icon: 'fa-network-wired' },
            leave: { label: '请假', icon: 'fa-umbrella-beach' },
            expense: { label: '报销', icon: 'fa-receipt' },
            admin: { label: '行政', icon: 'fa-building' },
        },
        STATUS_LABELS: {
            created: '已创建', assigned: '已指派', processing: '处理中',
            resolved: '已解决', closed: '已关闭',
        },

        async init() {
            updateIdentityUI();
            await this.loadStats();
            await this.loadTickets();
        },

        async loadStats() {
            try {
                const res = await fetch('/api/tickets/stats');
                const data = await res.json();
                if (data.data) {
                    const d = data.data;
                    this.stats = {
                        total: d.total || 0,
                        open: (d.by_status?.created || 0) + (d.by_status?.assigned || 0) + (d.by_status?.processing || 0),
                        resolved: (d.by_status?.resolved || 0) + (d.by_status?.closed || 0),
                        high_priority: (d.by_priority?.P0 || 0) + (d.by_priority?.P1 || 0),
                    };
                }
            } catch (e) {
                console.error('Failed to load stats:', e);
            }
        },

        async loadTickets() {
            this.loading = true;
            try {
                const params = new URLSearchParams();
                if (this.filters.type) params.set('ticket_type', this.filters.type);
                if (this.filters.status) params.set('status', this.filters.status);
                if (this.filters.priority) params.set('priority', this.filters.priority);
                params.set('limit', String(this.pageSize));
                params.set('offset', String((this.currentPage - 1) * this.pageSize));
                // 身份注入：员工只看自己的工单
                params.set('user_name', this.currentUser.user_name);
                params.set('role', this.currentUser.role);
                if (this.currentUser.role !== 'admin') {
                    params.set('requester_id', this.currentUser.user_name);
                }

                const res = await fetch(`/api/tickets/?${params.toString()}`);
                const data = await res.json();
                if (data.status === 'success') {
                    this.tickets = data.data || [];
                    this.totalCount = data.total || 0;
                    this.totalPages = Math.ceil(this.totalCount / this.pageSize) || 1;
                }
            } catch (e) {
                console.error('Failed to load tickets:', e);
                this.showToast('加载工单失败', 'error');
            } finally {
                this.loading = false;
            }
        },

        applyFilters() {
            this.currentPage = 1;
            this.expandedId = null;
            this.loadTickets();
            this.loadStats();
        },

        async updateStatus(ticketId, newStatus) {
            try {
                const params = new URLSearchParams();
                params.set('user_name', this.currentUser.user_name);
                params.set('role', this.currentUser.role);
                const res = await fetch(`/api/tickets/${ticketId}/status?${params.toString()}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus }),
                });
                if (res.ok) {
                    this.showToast(`工单状态已更新为: ${this.STATUS_LABELS[newStatus]}`, 'success');
                    await this.loadTickets();
                    await this.loadStats();
                } else {
                    const err = await res.json();
                    this.showToast(err.detail || '更新失败', 'error');
                }
            } catch (e) {
                this.showToast('更新请求失败', 'error');
            }
        },

        async approveTicket(ticketId) {
            try {
                const params = new URLSearchParams();
                params.set('user_name', this.currentUser.user_name);
                params.set('role', this.currentUser.role);
                const res = await fetch(`/api/tickets/${ticketId}/approve?${params.toString()}`, {
                    method: 'POST',
                });
                if (res.ok) {
                    const data = await res.json();
                    this.showToast(data.message || '审批通过', 'success');
                    await this.loadTickets();
                    await this.loadStats();
                } else {
                    const err = await res.json();
                    this.showToast(err.detail || '审批失败', 'error');
                }
            } catch (e) {
                this.showToast('审批请求失败', 'error');
            }
        },

        async rejectTicket(ticketId) {
            const reason = prompt('请输入驳回理由（可选）：');
            try {
                const params = new URLSearchParams();
                params.set('user_name', this.currentUser.user_name);
                params.set('role', this.currentUser.role);
                if (reason) params.set('reason', reason);
                const res = await fetch(`/api/tickets/${ticketId}/reject?${params.toString()}`, {
                    method: 'POST',
                });
                if (res.ok) {
                    const data = await res.json();
                    this.showToast(data.message || '已驳回', 'success');
                    await this.loadTickets();
                    await this.loadStats();
                } else {
                    const err = await res.json();
                    this.showToast(err.detail || '驳回失败', 'error');
                }
            } catch (e) {
                this.showToast('驳回请求失败', 'error');
            }
        },

        goPage(p) {
            if (p < 1 || p > this.totalPages) return;
            this.currentPage = p;
            this.expandedId = null;
            this.loadTickets();
        },

        get visiblePages() {
            const pages = [];
            const start = Math.max(1, this.currentPage - 2);
            const end = Math.min(this.totalPages, this.currentPage + 2);
            for (let i = start; i <= end; i++) pages.push(i);
            return pages;
        },

        getTypeIcon(type) {
            return (this.TYPE_CONFIG[type] || this.TYPE_CONFIG.it_fault).icon;
        },
        getTypeLabel(type) {
            return (this.TYPE_CONFIG[type] || this.TYPE_CONFIG.it_fault).label;
        },
        getStatusLabel(status) {
            return this.STATUS_LABELS[status] || status;
        },
        formatDate(d) {
            if (!d) return '-';
            return new Date(d).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        },
        formatDateFull(d) {
            if (!d) return '-';
            return new Date(d).toLocaleString('zh-CN');
        },

        showToast(message, type) {
            this.toast = { show: true, message, type };
        },
    };
}

// ============================================================
// Identity Management (global — shared by inline event handlers)
// ============================================================
// 每个身份有固定的角色，不可自由切换
const IDENTITY_MAP = {
    '张三': 'employee',
    '李四': 'employee',
    '王五': 'employee',
    '赵六': 'employee',
    '管理员': 'admin',
};

function loadIdentity() {
    try {
        const saved = localStorage.getItem('service_desk_identity');
        if (saved) {
            const parsed = JSON.parse(saved);
            // 确保角色与预设一致（防止 localStorage 被篡改）
            parsed.role = IDENTITY_MAP[parsed.user_name] || 'employee';
            return parsed;
        }
    } catch (e) {}
    return { user_name: '张三', role: 'employee' };
}

function saveIdentity() {
    const sel = document.getElementById('identity-select');
    const identity = {
        user_name: sel ? sel.value : '张三',
        role: IDENTITY_MAP[sel ? sel.value : '张三'] || 'employee',
    };
    localStorage.setItem('service_desk_identity', JSON.stringify(identity));
    updateIdentityUI();
    // 同步到 Alpine 组件
    const appEl = document.querySelector('[x-data]');
    if (appEl && appEl.__x) {
        const data = appEl.__x.$data;
        if (data) data.currentUser = identity;
    }
}

function onIdentityChange() {
    saveIdentity();
    // 刷新工单列表
    const appEl = document.querySelector('[x-data]');
    if (appEl && appEl.__x) {
        const data = appEl.__x.$data;
        if (data && data.loadTickets) {
            data.loadTickets();
            data.loadStats();
        }
    }
}

function updateIdentityUI() {
    const identity = loadIdentity();
    const sel = document.getElementById('identity-select');
    if (sel) sel.value = identity.user_name;

    const badge = document.getElementById('identity-badge-display');
    if (badge) {
        const roleLabel = identity.role === 'admin' ? '管理员' : '员工';
        const roleClass = identity.role === 'admin' ? 'admin' : 'employee';
        badge.innerHTML = `<span class="identity-badge ${roleClass}">${identity.user_name} · ${roleLabel}</span>`;
    }
}
</script>
